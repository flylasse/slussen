<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>Slussen icon proposal A: Sluice</title>
  <!-- Android adaptive icon: 108-unit canvas. Background layer full bleed, no corners: the launcher masks it. -->
  <g id="background"><rect width="108" height="108" fill="#0e2b2a"/></g>
  <!-- Foreground layer: all artwork inside the central 66-unit safe zone (21 to 87), scaled to 0.8 around the centre for legibility. -->
  <g id="foreground" transform="translate(54 54) scale(0.8) translate(-54 -54)"><rect x="27" y="64" width="23" height="18" rx="2" fill="#1f6f68"/><rect x="58" y="54" width="23" height="28" rx="2" fill="#2f8f83"/><rect x="49.5" y="46" width="9" height="38" rx="2" fill="#5fd4c4"/><path d="M28 32 H62" stroke="#0e2b2a" stroke-width="13" stroke-linecap="round"/><path d="M60 21 L81 32 L60 43 Z" fill="#0e2b2a" stroke="#0e2b2a" stroke-width="6" stroke-linejoin="round"/><path d="M28 32 H62" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/><path d="M60 21 L81 32 L60 43 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/></g>
  <!-- Monochrome layer for themed icons (Android 13 and later), tinted by the launcher. -->
  <g id="monochrome" display="none" color="#ffffff" transform="translate(54 54) scale(0.8) translate(-54 -54)"><rect x="27" y="64" width="23" height="18" rx="2" fill="currentColor" opacity=".45"/><rect x="58" y="54" width="23" height="28" rx="2" fill="currentColor" opacity=".7"/><rect x="49.5" y="46" width="9" height="38" rx="2" fill="currentColor" opacity=".85"/><path d="M28 32 H62" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M60 21 L81 32 L60 43 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></g>
</svg>
