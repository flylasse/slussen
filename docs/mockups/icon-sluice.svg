<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>Slussen icon proposal A: Sluice</title>
  <!-- Android adaptive icon: 108-unit canvas. Background layer full bleed, no corners: the launcher masks it. -->
  <g id="background"><rect width="108" height="108" fill="#0e2b2a"/></g>
  <!-- Foreground layer: all artwork inside the central 66-unit safe zone (21 to 87), scaled to 0.8 around the centre for legibility. -->
  <g id="foreground" transform="translate(54 54) scale(0.8) translate(-54 -54)"><rect x="27" y="60" width="23" height="22" rx="2" fill="#1f6f68"/><rect x="58" y="46" width="23" height="36" rx="2" fill="#2f8f83"/><rect x="49.5" y="32" width="9" height="52" rx="2" fill="#5fd4c4"/><path d="M29 38 H68" stroke="#e8ecf2" stroke-width="7" stroke-linecap="round"/><path d="M61 30 L70 38 L61 46" stroke="#e8ecf2" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- Monochrome layer for themed icons (Android 13 and later), tinted by the launcher. -->
  <g id="monochrome" display="none" color="#ffffff" transform="translate(54 54) scale(0.8) translate(-54 -54)"><rect x="27" y="60" width="23" height="22" rx="2" fill="currentColor" opacity=".55"/><rect x="58" y="46" width="23" height="36" rx="2" fill="currentColor" opacity=".8"/><rect x="49.5" y="32" width="9" height="52" rx="2" fill="currentColor"/><path d="M29 38 H68 M61 30 L70 38 L61 46" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
